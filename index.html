<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garaža Klub Koledar</title>

    <!-- Added to a phone's home screen this runs without browser chrome, so
         the page has to supply what the browser used to: an icon, a name to
         sit under it, and a colour for the status bar. -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <!-- iOS reads the apple-prefixed pair; everything else reads the other
         two. The name is spelled short here because a home screen truncates
         anything longer than about twelve characters. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="masCajt" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The app rewrites this whenever the theme changes; the value here is
         the default it starts on. -->
    <meta name="theme-color" content="#14181A" />

    <style>
      /* The app paints its own background, but only inside its root element.
         Standalone on iOS there is no browser behind it, so overscrolling
         past the top or bottom exposed the page itself -- white, whichever
         theme was chosen. --bg lands as soon as the app sets data-theme; the
         literal covers the moment before that. It matches the app default
         rather than the system setting -- the saved preference is not
         readable this early, and dark is what an unanswered device gets. */
      html,
      body {
        margin: 0;
        background: var(--bg, #14181a);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
          "styles": "./styles.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createClient } from "@supabase/supabase-js";

      // Project URL is not secret. The anon key below is also meant to be
      // public/shipped in client JS -- Supabase's row-level security
      // policies (see supabase-schema.sql) are what actually guard the
      // data, not secrecy of this key. Never put the "service_role" key
      // here instead; that one *is* secret and bypasses RLS entirely.
      const SUPABASE_URL = "https://mpiliybdfhgqslubvhwd.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_3888vcj_lpaerHs9H74Llg_-0p1W_MC";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // "my-name" stays on this device only (no reason to sync your own
      // name across browsers) via localStorage. Everything under the
      // "avail:" prefix is the actual shared calendar data and is backed
      // by a Supabase table (see supabase-schema.sql) so it's visible to
      // everyone who opens the page, not just this browser.
      const STORAGE_PREFIX = "skupni-koledar:";
      const localStore = {
        async get(key) {
          const raw = localStorage.getItem(STORAGE_PREFIX + key);
          return { value: raw === null ? null : raw };
        },
        async set(key, value) {
          localStorage.setItem(STORAGE_PREFIX + key, value);
          return { ok: true };
        },
        async delete(key) {
          localStorage.removeItem(STORAGE_PREFIX + key);
          return { ok: true };
        },
        async list(prefix) {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(STORAGE_PREFIX + prefix)) {
              keys.push(k.slice(STORAGE_PREFIX.length));
            }
          }
          return { keys };
        },
        // Nothing here can ever match: the only keys routed to this store are
        // this device's own name and theme, never an "avail:" row. Present so
        // callers never have to check which store answered, same as subscribe.
        async firstKey() {
          return { key: null };
        },
        async range(fromKey, toKey) {
          const rows = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.startsWith(STORAGE_PREFIX)) continue;
            const bare = k.slice(STORAGE_PREFIX.length);
            if (bare >= fromKey && bare < toKey) {
              rows.push({ key: bare, value: localStorage.getItem(k) });
            }
          }
          return { rows };
        },
        // Nothing to listen to: the only keys routed here are this device's
        // own name and theme, which nobody else can change. Present anyway
        // so callers never have to check which store they landed on.
        subscribe() {
          return () => {};
        },
      };

      const sharedStore = {
        async get(key) {
          const { data, error } = await supabase
            .from("kv_store")
            .select("value")
            .eq("key", key)
            .maybeSingle();
          if (error) throw error;
          return { value: data ? data.value : null };
        },
        async set(key, value) {
          const { error } = await supabase
            .from("kv_store")
            .upsert({ key, value, updated_at: new Date().toISOString() });
          if (error) throw error;
          return { ok: true };
        },
        async delete(key) {
          const { error } = await supabase.from("kv_store").delete().eq("key", key);
          if (error) throw error;
          return { ok: true };
        },
        async list(prefix) {
          const { data, error } = await supabase
            .from("kv_store")
            .select("key")
            .like("key", `${prefix}%`);
          if (error) throw error;
          return { keys: (data || []).map((row) => row.key) };
        },
        // The single oldest key matching a pattern -- ordered and limited in
        // postgres rather than fetched and sorted here. The archive asks for
        // the oldest event so it knows where history ends, and that answer
        // must not cost a scan of the whole table.
        async firstKey(like) {
          const { data, error } = await supabase
            .from("kv_store")
            .select("key")
            .like("key", like)
            .order("key", { ascending: true })
            .limit(1);
          if (error) throw error;
          return { key: data && data[0] ? data[0].key : null };
        },
        // Keys sort lexicographically and dates are ISO, so a key range is a
        // date range: this pulls the whole visible window in one request
        // instead of a list() per day plus a get() per entry.
        async range(fromKey, toKey) {
          const { data, error } = await supabase
            .from("kv_store")
            .select("key,value")
            .gte("key", fromKey)
            .lt("key", toKey);
          if (error) throw error;
          return { rows: data || [] };
        },
        // Live updates. Postgres streams every change to this table and the
        // payload carries the row itself, so reacting to someone else's save
        // costs one small message rather than re-running the window query.
        //
        // The visible-window filter is applied by the caller, not here: a
        // postgres_changes subscription takes a single filter expression,
        // and the window needs two bounds (>= the first day, < the day after
        // the last one). The table is small enough that the difference is a
        // few ignored messages.
        subscribe({ onChange, onStatus }) {
          const channel = supabase
            .channel("kv_store_changes")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "kv_store" },
              (payload) => {
                const isDelete = payload.eventType === "DELETE";
                // A delete carries the row only under `old`; inserts and
                // updates carry it under `new`.
                const row = isDelete ? payload.old : payload.new;
                if (!row || !row.key) return;
                onChange({
                  type: payload.eventType,
                  key: row.key,
                  value: isDelete ? null : row.value,
                });
              }
            )
            .subscribe((status) => onStatus && onStatus(status));
          return () => supabase.removeChannel(channel);
        },
      };

      // Photos are files, not key/value text, so they go to Supabase Storage
      // rather than into kv_store. A window query pulls every value it
      // matches and realtime pushes every changed row to every open browser,
      // so an image sitting in a row would ride along on both -- repeatedly,
      // and for everyone. What kv_store holds is only the path.
      const PHOTO_BUCKET = "arhiv";
      window.photos = {
        // upsert stays off: a clash means two uploads generated the same id in
        // the same millisecond, and failing is better than one silently
        // replacing the other's photo.
        async upload(path, blob) {
          const { error } = await supabase.storage
            .from(PHOTO_BUCKET)
            .upload(path, blob, {
              contentType: blob.type || "image/jpeg",
              upsert: false,
            });
          if (error) throw error;
          return { path };
        },
        publicUrl(path) {
          const { data } = supabase.storage.from(PHOTO_BUCKET).getPublicUrl(path);
          return data.publicUrl;
        },
      };

      window.storage = {
        get: (key, shared) => (shared ? sharedStore : localStore).get(key),
        set: (key, value, shared) => (shared ? sharedStore : localStore).set(key, value),
        delete: (key, shared) => (shared ? sharedStore : localStore).delete(key),
        list: (prefix, shared) => (shared ? sharedStore : localStore).list(prefix),
        firstKey: (like, shared) => (shared ? sharedStore : localStore).firstKey(like),
        range: (fromKey, toKey, shared) =>
          (shared ? sharedStore : localStore).range(fromKey, toKey),
        subscribe: (handlers, shared) =>
          (shared ? sharedStore : localStore).subscribe(handlers),
      };

      const source = await (await fetch("./skupni-koledar.jsx")).text();
      const { code } = Babel.transform(source, {
        presets: [["react", { runtime: "automatic" }]],
        filename: "skupni-koledar.jsx",
      });
      const blobUrl = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" })
      );
      const [{ default: App }, { createRoot }, { createElement }] = await Promise.all([
        import(blobUrl),
        import("react-dom/client"),
        import("react"),
      ]);
      createRoot(document.getElementById("root")).render(createElement(App));
    </script>
    <!-- Ponudba namestitve aplikacije (PWA) ob odprtju. Samostojno, ne
         posega v React ne v service worker (ta tu namenoma ne predpomni). -->
    <script src="./install-promo.js"></script>
  </body>
</html>
